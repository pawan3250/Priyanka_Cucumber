name: Cucumber Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_tag:
        description: Select the tag to run
        type: choice
        options:
          - all
          - home
          - blog
          - shop
          - cart
          - contact
          - myaccount
          - curriculum
        default: all
      browser:
        description: Select the browser to run
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: chromium

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install ${{ inputs.browser || 'chromium' }}

      - name: Run Cucumber tests
        shell: pwsh
        env:
          BROWSER: ${{ inputs.browser || 'chromium' }}
        run: |
          $tag = "${{ inputs.test_tag || 'all' }}"
          if ($tag -eq "all") {
            npm test
          } else {
            npm test -- --tags "@$tag"
          }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
